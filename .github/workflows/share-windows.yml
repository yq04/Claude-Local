name: Build private Windows share artifact

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-windows-share-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
  package:
    name: Unsigned current-user NSIS package
    needs: checks
    if: github.event.repository.private == true
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      CARGO_TERM_COLOR: always
      TAURI_SIGNING_PRIVATE_KEY: ''
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.5'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Prepare locked build tools
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup default 1.98.1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri -> target
          shared-key: claude-local-package-windows-msvc
          cache-on-failure: true
      - name: Fetch the pinned browser engine
        run: python scripts/fetch-browser.py
      - name: Build the host and browser in one installer
        run: bun run build:windows
      - name: Collect the installer, notices and checksums
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($config.productName -ne 'Claude-Local' -or $config.identifier -ne 'ai.local.claude-local' -or $config.mainBinaryName -ne 'claude-local') {
            throw 'Unexpected product identity in the share package'
          }
          $windows = Get-Content src-tauri/tauri.windows.conf.json -Raw | ConvertFrom-Json
          if ($windows.bundle.targets -notcontains 'nsis' -or $windows.bundle.windows.nsis.installMode -ne 'currentUser') {
            throw 'Expected a current-user NSIS bundle'
          }
          if ($windows.bundle.resources.PSObject.Properties.Name -notcontains '../browser-runtime/WindowsBrowser/') {
            throw 'The companion browser must be included in the installer resources'
          }
          if (-not (Test-Path src-tauri/target/release/claude-local.exe)) { throw 'Missing local host executable' }
          if (-not (Test-Path browser-runtime/WindowsBrowser/chrome.exe)) { throw 'Missing companion browser engine' }
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe -File)
          if ($installers.Count -ne 1) { throw 'Expected one current-user NSIS installer' }
          $share = Join-Path $env:RUNNER_TEMP 'claude-local-share'
          $notices = Join-Path $share 'licenses'
          New-Item -ItemType Directory -Path $notices -Force | Out-Null
          Copy-Item -LiteralPath $installers[0].FullName -Destination $share
          Copy-Item -LiteralPath LICENSE,NOTICE.md -Destination $share
          Copy-Item -LiteralPath docs/DISTRIBUTION.md -Destination (Join-Path $share 'DISTRIBUTION.md')
          Copy-Item -LiteralPath browser-runtime/LICENSE.fingerprint-chromium,assets/ai-icons/LICENSE.lobehub.txt,src-tauri/windows/LICENSE.unicode.txt -Destination $notices
          $engineVersion = (Get-Content browser-runtime/version.txt -Raw).Trim()
          $manifest = [ordered]@{
            product = $config.productName
            version = $config.version
            identifier = $config.identifier
            commit = $env:GITHUB_SHA
            host = 'claude-local.exe'
            browser = 'Claude-Local-Browser'
            engineVersion = $engineVersion
            engineSource = "https://github.com/adryfish/fingerprint-chromium/releases/download/$engineVersion/ungoogled-chromium_$engineVersion-1.1_windows_x64.zip"
            engineExecutableSha256 = (Get-FileHash browser-runtime/WindowsBrowser/chrome.exe -Algorithm SHA256).Hash.ToLowerInvariant()
            installerSha256 = (Get-FileHash $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            signed = $false
            distribution = 'private review; third-party redistribution terms remain subject to NOTICE.md'
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $share 'manifest.json') -Encoding utf8
          $sumPath = Join-Path $share 'SHA256SUMS'
          Get-ChildItem $share -File | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content -LiteralPath $sumPath -Encoding utf8
          "CLAUDE_LOCAL_SHARE=$share" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Claude-Local-windows-x64-${{ github.run_id }}
          path: ${{ env.CLAUDE_LOCAL_SHARE }}/
          if-no-files-found: error
          retention-days: 14
