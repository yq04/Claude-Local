name: Build private Windows share artifact

on:
  workflow_dispatch:
    inputs:
      delivery_transport:
        description: 'Delivery transport mechanism'
        required: true
        default: 'actions-artifact'
        type: choice
        options:
          - actions-artifact
          - private-draft

permissions:
  contents: read

concurrency:
  group: private-windows-share-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
  package:
    name: Unsigned current-user NSIS package
    needs: checks
    if: github.event.repository.private == true
    permissions:
      contents: write
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      CARGO_TERM_COLOR: always
      TAURI_SIGNING_PRIVATE_KEY: ''
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.5'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Prepare locked build tools
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup default 1.98.1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install --disable-pip-version-check -r scripts/requirements-ci.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri -> target
          shared-key: claude-local-package-windows-msvc
          cache-on-failure: true
      - name: Fetch the pinned browser engine
        run: python scripts/fetch-browser.py
      - name: Verify the isolated quota bridge
        run: node scripts/test-quota-browser-bridge.mjs
      - name: Verify real navigation quota integration
        run: node scripts/test-quota-integration.mjs
      - name: Verify online quota controls with synthetic identities
        run: node --experimental-strip-types scripts/test-identities-ui.ts --online-only
      - name: Build the host and browser in one installer
        run: |
          $ErrorActionPreference = 'Stop'
          $auditedShare = $null
          & bun run build:windows | ForEach-Object {
            $line = [string]$_
            Write-Host $line
            if ($line.StartsWith('{"artifactDirectory":')) { $auditedShare = $line | ConvertFrom-Json }
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not $auditedShare) { throw 'Missing canonical build audit receipt' }
          "CLAUDE_LOCAL_AUDITED_SHARE=$($auditedShare.artifactDirectory)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Collect the installer, notices and checksums
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($config.productName -ne 'Claude-Local' -or $config.identifier -ne 'ai.local.claude-local' -or $config.mainBinaryName -ne 'claude-local') {
            throw 'Unexpected product identity in the share package'
          }
          $windows = Get-Content src-tauri/tauri.windows.conf.json -Raw | ConvertFrom-Json
          if ($windows.bundle.targets -notcontains 'nsis' -or $windows.bundle.windows.nsis.installMode -ne 'currentUser') {
            throw 'Expected a current-user NSIS bundle'
          }
          if ($windows.bundle.resources.PSObject.Properties.Name -notcontains '../browser-runtime/WindowsBrowser/') {
            throw 'The companion browser must be included in the installer resources'
          }
          if (-not (Test-Path src-tauri/target/release/claude-local.exe)) { throw 'Missing local host executable' }
          if (-not (Test-Path browser-runtime/WindowsBrowser/chrome.exe)) { throw 'Missing companion browser engine' }
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe -File)
          if ($installers.Count -ne 1) { throw 'Expected one current-user NSIS installer' }
          $share = Join-Path $env:RUNNER_TEMP 'claude-local-share'
          $notices = Join-Path $share 'licenses'
          New-Item -ItemType Directory -Path $notices -Force | Out-Null
          # Preserve public build inputs so a resource-constrained workstation can
          # independently re-audit the exact NSIS payload without rebuilding it or
          # attempting to reverse the bundler's executable transformation.
          $buildInputs = Join-Path $share 'build-inputs'
          $buildEvidence = Join-Path $share 'build-evidence'
          New-Item -ItemType Directory -Path $buildInputs,$buildEvidence -Force | Out-Null
          Copy-Item -LiteralPath src-tauri/target/release/claude-local.exe -Destination (Join-Path $buildInputs 'claude-local.exe')
          Copy-Item -LiteralPath dist -Destination (Join-Path $buildInputs 'browser-ui') -Recurse
          Copy-Item -LiteralPath (Join-Path $env:CLAUDE_LOCAL_AUDITED_SHARE 'privacy-audit.json'),(Join-Path $env:CLAUDE_LOCAL_AUDITED_SHARE 'resource-manifest.json') -Destination $buildEvidence
          Copy-Item -LiteralPath $installers[0].FullName -Destination $share
          Copy-Item -LiteralPath LICENSE,NOTICE.md -Destination $share
          Copy-Item -LiteralPath docs/DISTRIBUTION.md -Destination (Join-Path $share 'DISTRIBUTION.md')
          Copy-Item -LiteralPath browser-runtime/LICENSE.fingerprint-chromium,assets/ai-icons/LICENSE.lobehub.txt,src-tauri/windows/LICENSE.unicode.txt -Destination $notices
          $engineVersion = (Get-Content browser-runtime/version.txt -Raw).Trim()
          $manifest = [ordered]@{
            product = $config.productName
            version = $config.version
            identifier = $config.identifier
            commit = $env:GITHUB_SHA
            host = 'claude-local.exe'
            browser = 'Claude-Local-Browser'
            engineVersion = $engineVersion
            engineSource = "https://github.com/adryfish/fingerprint-chromium/releases/download/$engineVersion/ungoogled-chromium_$engineVersion-1.1_windows_x64.zip"
            engineExecutableSha256 = (Get-FileHash browser-runtime/WindowsBrowser/chrome.exe -Algorithm SHA256).Hash.ToLowerInvariant()
            installerSha256 = (Get-FileHash $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            hostSha256 = (Get-FileHash (Join-Path $buildInputs 'claude-local.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
            frontendFiles = @(Get-ChildItem (Join-Path $buildInputs 'browser-ui') -File -Recurse | Sort-Object FullName | ForEach-Object {
              [ordered]@{
                path = [IO.Path]::GetRelativePath((Join-Path $buildInputs 'browser-ui'), $_.FullName).Replace('\','/')
                sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              }
            })
            signed = $false
            distribution = 'private review; third-party redistribution terms remain subject to NOTICE.md'
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $share 'manifest.json') -Encoding utf8
          $sumPath = Join-Path $share 'SHA256SUMS'
          Get-ChildItem $share -File | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content -LiteralPath $sumPath -Encoding utf8
          "CLAUDE_LOCAL_SHARE=$share" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Upload Actions artifact
        if: inputs.delivery_transport == 'actions-artifact' || inputs.delivery_transport == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Claude-Local-windows-x64-${{ github.run_id }}
          path: ${{ env.CLAUDE_LOCAL_SHARE }}/
          if-no-files-found: error
          retention-days: 14
      - name: Publish private review draft release
        if: inputs.delivery_transport == 'private-draft' && github.event.repository.private == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $shareDir = $env:CLAUDE_LOCAL_SHARE
          if (-not (Test-Path -LiteralPath $shareDir -PathType Container)) { throw 'Missing share directory' }

          $repoJson = & gh repo view --json isPrivate
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect repository visibility' }
          $repoView = $repoJson | ConvertFrom-Json
          if (-not $repoView.isPrivate) { throw 'Refusing draft upload: target repository is not private' }

          $shareManifest = Get-Content -LiteralPath (Join-Path $shareDir 'manifest.json') -Raw | ConvertFrom-Json
          $version = [string]$shareManifest.version
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $shareManifest.commit -ne $env:GITHUB_SHA) {
            throw 'Share version or source commit does not match this workflow run'
          }
          $tag = "build-$version-$($env:GITHUB_RUN_ID)"
          $tagResponse = @(& gh api --include ('repos/' + $env:GITHUB_REPOSITORY + '/git/ref/tags/' + $tag) 2>&1)
          $tagStatus = $LASTEXITCODE
          if ($tagStatus -eq 0) { throw "Refusing upload: tag $tag already exists" }
          $tagResponseText = $tagResponse -join "`n"
          if ($tagResponseText -notmatch '(?m)^HTTP/\S+\s+404\b') {
            throw "Unable to establish that tag $tag is absent (non-404 error or timeout)"
          }

          $releaseResponse = @(& gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName 2>&1)
          $releaseStatus = $LASTEXITCODE
          if ($releaseStatus -eq 0) { throw "Refusing upload: a release or draft for tag $tag already exists" }
          $releaseResponseText = $releaseResponse -join "`n"
          if ($releaseResponseText -notmatch '(?i)(release not found|could not find|404)') {
            throw "Unable to establish that release for tag $tag is absent"
          }

          $zipName = "Claude-Local-windows-x64-$tag.zip"
          $zipPath = Join-Path $env:RUNNER_TEMP $zipName
          Compress-Archive -Path (Join-Path $shareDir '*') -DestinationPath $zipPath -CompressionLevel Optimal
          if (-not (Test-Path -LiteralPath $zipPath -PathType Leaf)) { throw 'Failed to create share zip archive' }

          $zipSha = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipBytes = (Get-Item -LiteralPath $zipPath).Length

          $notesLines = @(
            "# Claude-Local $version Private Review Build Draft",
            "",
            "- Build Tag: $tag",
            "- Source Commit: $($env:GITHUB_SHA)",
            "- Workflow Run ID: $($env:GITHUB_RUN_ID)",
            "- Archive File: $zipName",
            "- Archive Size: $zipBytes bytes",
            "- Archive SHA256: $zipSha",
            "- Transport: private-draft (bypassing Actions artifact storage quota)",
            "- State: Strictly draft and prerelease. Must not be published directly or made public."
          )
          $notesPath = Join-Path $env:RUNNER_TEMP 'draft-release-notes.md'
          $notesLines | Set-Content -LiteralPath $notesPath -Encoding utf8

          & gh release create $tag `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Claude-Local $version Build $($env:GITHUB_RUN_ID) (Draft)" `
            --notes-file $notesPath `
            --draft `
            --prerelease `
            $zipPath

          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }

          $created = & gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft,isPrerelease,tagName,assets | ConvertFrom-Json
          if (-not $created.isDraft -or -not $created.isPrerelease -or $created.tagName -ne $tag) {
            throw 'Uploaded release is not strictly draft and prerelease'
          }
          if (@($created.assets).Count -ne 1) {
            throw 'Expected exactly one uploaded zip asset'
          }
          Write-Host "Private draft release $tag verified: isDraft=$($created.isDraft), isPrerelease=$($created.isPrerelease), asset=$($created.assets[0].name)"
