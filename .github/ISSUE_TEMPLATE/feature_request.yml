# [INPUT]: Voluntary redacted contributor feedback.
# [OUTPUT]: Public requirement discussion without implementation promises.
# [POS]: GitHub presentation only; no app runtime or secret collection.
name: 功能建议 (Feature Request)
description: 为 Claude-Local 提出新的功能构想或使用体验改进建议
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出改进构想！

        **声明**：本表单仅用于收集社区功能建议与需求场景。维护者会综合架构边界（面向 Windows x64 独立维护与打包分发）、系统稳定性、隐私保护与安全要求进行考量，**提交本表单不构成功能排期或实现承诺**。

  - type: textarea
    id: problem
    attributes:
      label: 需求背景与痛点 (Problem Statement)
      description: 您在日常使用中遇到了什么不便，或者当前功能缺少什么支持？
      placeholder: "请清晰描述当前遇到的场景、痛点或限制..."
    validations:
      required: true

  - type: textarea
    id: suggested_benefit
    attributes:
      label: 建议方案与预期收益 (Suggested Solution & Benefits)
      description: 您希望 Claude-Local 如何改进，该功能将带来怎样的效率提升或体验改善？
      placeholder: "请描述建议的新增功能、操作流程或界面交互..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案或补充上下文 (Alternatives & Context)
      description: 可选填。您是否尝试或考虑过其他临时变通方法，是否有其他参考实现？
      placeholder: "可选：在此处补充其他背景信息、替代思路或参考..."
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交确认 (Confirmation)
      options:
        - label: "我已阅读说明，理解本表单为需求探讨与建议，不构成排期承诺；且内容未包含任何私密账号、凭据或敏感信息"
          required: true
