# [INPUT]: Voluntary redacted contributor feedback.
# [OUTPUT]: Public versioned/diagnostic feedback with privacy confirmation.
# [POS]: GitHub presentation only; no app runtime or secret collection.
name: 缺陷反馈 (Bug Report)
description: 提交 Claude-Local 在 Windows x64 运行中遇到的错误或异常
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈问题！在提交前，请先查阅 [常见问题与恢复指南](https://github.com/yq04/Claude-Local/blob/main/docs/CONNECTION_RECOVERY.md) 核实是否为授权状态脱节或网络策略阻断。

        **隐私安全须知**：请勿在 Issue 中提供任何真实账号密码、Token、API Key、Cookie、加密归档文件或网络代理凭据。

  - type: dropdown
    id: version
    attributes:
      label: 发生版本 (App Version)
      description: 请选择您当前运行的 Claude-Local 版本（可从主界面或安装包文件名确认）
      options:
        - "0.1.5 (当前最新)"
        - "0.1.4"
        - "0.1.3"
        - "0.1.2"
        - "0.1.1"
        - "0.1.0"
        - "源码构建 (Source build)"
        - "其他 / 未知"
      default: 0
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 运行环境 (Environment)
      description: 您的操作系统版本与运行环境细节
      placeholder: "例如：Windows 11 Pro 23H2 x64, Python 3.12"
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: 涉及组件 (Component)
      description: 发生异常的功能模块
      options:
        - "身份管理 (Identity Management - 备份/切换/导入/导出)"
        - "用量分析 (Usage Analytics - 统计图表/Token/Effort/TSV)"
        - "额度观察与唤醒调度 (Quota Monitor & Wakeup - 5h/7d 窗口/自动续杯)"
        - "隔离浏览器 (Isolated Browser - WebRTC/指纹/资料隔离)"
        - "快速配置与网络环境 (Quick Setup & Network)"
        - "安装与卸载 (NSIS Installer / Upgrade)"
        - "其他组件 / 未知"
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤 (Steps to Reproduce)
      description: 请清晰分步描述导致该问题出现的具体操作
      placeholder: |
        1. 打开 Claude-Local 主界面
        2. 点击...
        3. 执行...
        4. 观察到异常
    validations:
      required: true

  - type: textarea
    id: expected_actual
    attributes:
      label: 预期行为与实际行为 (Expected vs Actual Behavior)
      description: 描述预期应发生的结果，以及实际发生的现象或报错信息
      placeholder: |
        【预期行为】：

        【实际行为】：
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: 去标识化日志或错误提示 (Optional De-identified Diagnostics)
      description: 可选填。若有终端输出或界面错误弹窗，请脱敏后粘贴（务必隐去个人路径、真实邮箱、IP及凭据）
      render: shell
      placeholder: "可选：在此处粘贴已去标识化的错误日志或控制台提示..."
    validations:
      required: false

  - type: checkboxes
    id: privacy_confirmation
    attributes:
      label: 隐私合规与信息安全确认 (Privacy Confirmation)
      description: 为保护您的账号安全与个人隐私，提交前必须确认：
      options:
        - label: "不含密钥/OAuth、Cookie、账号归档、邮箱/代理凭据、完整本地会话票据"
          required: true
