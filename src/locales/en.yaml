help.bgShellSwitchTitle: "How to Switch Accounts Mid-Run Without Stopping Background Shells?"
help.bgShellSwitchLine1: "Option 1 (Automatic, recommended): start via cr -AutoContinue (or Relay CLI); at quota limits it sends /exit, presses 2 (Move to background and exit), parks the old daemon, and re-adopts under the next account."
help.bgShellSwitchLine2: "Option 2 (Manual terminal switch): run /exit and press 2 (Move to background and exit) in your terminal, click Switch in Claude-Local to gracefully park the outgoing daemon while keeping shells alive, then run claude attach <id> or claude --resume."
help.bgShellSwitchLine3: "Note: do not force-switch while interactive Claude still holds foreground child shells (pwsh / bash / python), which breaks stdio pipes; keep Keep in Workspace -> Session History enabled when switching."
