help.relayTitle: "智能接力与多号子代理"
help.relayLine1: "终端执行 cr 可无感跨号接力续跑：默认「干净交接」在新账号开启全新会话并读取脱敏交接摘要（不复用旧会话 ID），同账号续跑仍用 --resume；@pro-pool-worker（claude-subagent）在隔离 CLAUDE_CONFIG_DIR 槽位并发调度备用号。"
help.relayLine2: "「重置卡收割」优先消耗含临期重置卡的账号并在 7d 达 98% 时停用，配合「去重置」与「同步验证」一键确认恢复并解除冷却。"
help.relayLine3: "同出口防关联准则：同端口并发保持 ≤2 路；切勿在非 :7899 家宽出口的手机或宿主浏览器点击登录魔法链接或账单邮件，各账号保持独立设备标识与浏览器槽位。"
help.usageLine1: "纯本地统计多账号四类 Token 构成、官方 API 等效花费、提示词缓存节省、会话深度与折算订阅回本倍率（回本 X.X×）。"
help.usageLine2: "支持一键生成 2x 高清概览/趋势长图海报、复制脱敏 Markdown 简报与导出防公式注入 TSV 表格。"
