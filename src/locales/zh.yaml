identities.warming.sop.warmingFree: "【轻度养号 (Day 4–7)】1. 固定同城家宽与独立浏览器槽位，每周 3–5 天轻度对话；2. 避免单次超大代码库或连续高频请求；3. 满 7 天无二次验证后切至「可升级转正」。"
identities.warming.sop.proReady: "【可升级转正】1. 绑卡账单国家/邮编须匹配静态家宽出口；2. 升级 Pro/Max 后稳定使用 24 小时，再「转正为 CLI 身份」接入终端。"
