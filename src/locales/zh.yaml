# ----- 跨身份切换后台 Shell 无损保活、守护优雅挂起与任务接管 -----
identities.switchBgDaemonDesc: "检测到会话已「移至后台运行」：切换时将压缩暂存当前状态并优雅挂起旧账号后台守护进程，分离的后台 Shell 任务保持运行不中断。"
