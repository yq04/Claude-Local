identities.bgDaemonContinuityTitle: "后台 Shell 无损保活就绪"
identities.bgDaemonContinuityDesc: "当前仅剩「移至后台运行」后的守护与后台会话进程。切换身份将优雅挂起旧号守护进程（后台 Shell 继续运行并保留 adopt.json）；切号后在新终端执行 {cmd} 即可无缝接管输出。"
identities.bgDaemonSessionsLabel: "后台守护与工作进程（切换时将优雅挂起，后台 Shell 保持运行）"
identities.sessionBackgroundTag: "后台守护"
identities.copyResumeCmdBtn: "复制 {cmd}"
identities.copiedResumeCmd: "已复制：{cmd}"
identities.childShellsWarnTitle: "检测到运行中的前台子 Shell：{shells}"
identities.childShellsWarnDesc: "当前交互式 Claude 尚未退出且挂有子进程；直接强行切号会断开前台标准管道（pipe）导致命令中断。建议先在终端执行 /exit 并按 2（Move to background and exit / 移至后台运行）后再切换，或使用 cr 无感接力。"
identities.adoptHistoryDisabledHint: "提示：当前存在后台待接管任务，建议保持「保留在工作区 → 会话历史」开启以确保新账号可直接接管会话上下文。"
help.bgShellSwitchTitle: "运行到一半没额度、且有后台 Shell 任务时如何无损切号？"
help.bgShellSwitchLine1: "方式 1（全自动推荐）：使用 cr -AutoContinue（或点击「接力终端」）启动会话；额度触顶时自动发送 /exit 并按 2（Move to background and exit）挂入后台，优雅挂起旧守护后自动换号接管续跑。"
help.bgShellSwitchLine2: "方式 2（普通终端手动无损切号）：在终端输入 /exit 后按 2 选择「Move to background and exit（移至后台运行）」，回到 Claude-Local 点击「切换」自动优雅挂起旧守护并保活后台 Shell，切号后执行 claude attach <id> 或 claude --resume 继续看输出。"
help.bgShellSwitchLine3: "注意：切勿在交互式 Claude 仍挂着前台子进程（pwsh / bash / python）时直接强退切号，否则标准管道会断连；切换时请保持「保留在工作区 → 会话历史」开启。"
