risk.checklist.step2Title: "手机开启「飞行模式」后单独打开 Wi-Fi"
risk.checklist.step2Desc: "彻底物理切断手机 4G/5G 蜂窝基站 IP、运营商蜂窝 DNS 与双栈 IPv6 抢答通道。"
