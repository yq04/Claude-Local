logs.methodTitle: "指标口径与隐私边界"
logs.methodTiming: "时间与耗时口径：时间戳显示单次请求的最终响应完成时刻，默认遵循系统时区，也可在筛选栏切换为北京时间/美东时间/UTC 核对（不改系统时区）。端到端耗时基于本地 JSONL 中父级请求至最终响应分块的毫秒差值（限定 50ms–20min）；已被 Claude Code 自动清理的早期归档仅保留秒级时间戳，耗时与 TPS 显示为「—」。"
logs.methodTps: "TPS 口径：单次请求输出速率 = 输出 Token ÷ 端到端请求耗时（秒），自动过滤超物理上限（>2000 tok/s）的异常锚点；筛选汇总栏采用加权均值（总已测输出 Token ÷ 总已测耗时）。"
logs.methodCost: "花费口径：按官方 Anthropic API 对应模型阶梯单价（含缓存写入/读取折扣及 fast/ultrafast 速度倍率）本地离线估算等效美元价值，不代表订阅实际扣费。"
logs.methodAttribution: "归属口径：仅在 Claude-Local 受控切换或可证明归属的会话窗口内记录账号；早期未建档或外部工具改动 .claude.json 缺口期间的请求保持「未归属」，绝不猜测改写历史。"
logs.methodPrivacy: "隐私边界：账本仅保存哈希后的请求/会话指纹、Token 计数与枚举元数据，绝不落盘原始提示词、代码正文、本地路径或原始凭据，并遵循全局隐私打码设置。"
