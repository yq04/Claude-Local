risk.mobile.srStep3Title: "免传文件开启防 WebRTC / QUIC / DNS 泄露"
risk.mobile.srStep3Desc: "无需微信或隔空投送：在小火箭「配置」页点 default.conf 右侧 ⓘ ->「复制配置」-> 点新副本 ⓘ ->「编辑配置」->「通用」：关闭 IPv6、DNS 填 https://1.1.1.1/dns-query、UDP 转发未支持行为选 REJECT -> 返回点「使用配置」，首页「全局路由」选「代理」（或展开下方纯文本用相机实况文本拷贝导入）。"
risk.mobile.srStep4Title: "勾选家宽节点并在 Safari 无痕核对 ip= 与 http/2"
risk.mobile.srStep4Desc: "首页勾选该静态家宽节点并打开顶部开关（列表测速不走「代理通过」链，显示红色「超时」属正常现象，切勿删除）；用 Safari 无痕浏览访问 claude.ai/cdn-cgi/trace 与 withpersona.com/cdn-cgi/trace，确认 ip= 与电脑一致且 http=http/2（证明 UDP/QUIC 已阻断）即可扫码。"
